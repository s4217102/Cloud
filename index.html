<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mot à Mot Dictionary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Figtree:wght@400;500;600;700&family=Charis+SIL:wght@400&display=swap">
<style>
  /* ---------- Colours (light + dark) ---------- */
  :root {
    --ground: #EEF1F6;
    --surface: #FFFFFF;
    --ink: #172033;
    --muted: #5B6478;
    --line: #D7DCE6;
    --en: #2745C9;       /* English = blue */
    --en-soft: #E4E9FB;
    --fr: #C8324C;       /* French = red */
    --fr-soft: #FBE6EA;
    --note: #FFF6D9;
    --note-ink: #5C4A10;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0E121A; --surface: #161C28; --ink: #E4E8F1; --muted: #97A0B4; --line: #283044;
      --en: #8EA4FF; --en-soft: #1D2748; --fr: #FF8FA2; --fr-soft: #3A1C25;
      --note: #2C2714; --note-ink: #EADCA6;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0E121A; --surface: #161C28; --ink: #E4E8F1; --muted: #97A0B4; --line: #283044;
    --en: #8EA4FF; --en-soft: #1D2748; --fr: #FF8FA2; --fr-soft: #3A1C25;
    --note: #2C2714; --note-ink: #EADCA6;
  }

  /* ---------- Base ---------- */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 16px/1.55 "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--en); outline-offset: 2px; }
  .ipa { font-family: "Charis SIL", "Doulos SIL", "Gentium Plus", "Lucida Sans Unicode", serif; }

  /* ---------- Header ---------- */
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { font-family: "Literata", Georgia, serif; font-weight: 700; font-size: 26px; margin: 0; letter-spacing: -0.01em; }
  .brand span { color: var(--fr); }
  .brand em { font-style: normal; color: var(--en); }
  .tagline { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

  .direction { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
  .lang-tag { padding: 6px 12px; border-radius: 999px; font-weight: 600; font-size: 14px; }
  .lang-tag.en { background: var(--en-soft); color: var(--en); }
  .lang-tag.fr { background: var(--fr-soft); color: var(--fr); }
  .swap { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; }
  .swap:hover { background: var(--ground); }

  /* ---------- Search ---------- */
  .search { margin-top: 20px; display: flex; gap: 8px; }
  .field { position: relative; flex: 1; min-width: 0; }
  .suggestions {
    position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 6px); margin: 0; padding: 6px;
    list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.14);
  }
  .suggestions button {
    width: 100%; border: 0; background: transparent; border-radius: 8px; padding: 8px 10px;
    display: flex; align-items: baseline; gap: 8px; text-align: left;
  }
  .suggestions button:hover, .suggestions button.on { background: var(--ground); }
  .suggestions .flag { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; border-radius: 4px; padding: 1px 5px; }
  .suggestions .flag.en { background: var(--en-soft); color: var(--en); }
  .suggestions .flag.fr { background: var(--fr-soft); color: var(--fr); }
  .suggestions small { color: var(--muted); margin-left: auto; text-align: right; }
  .search input {
    width: 100%; min-width: 0; font: inherit; font-size: 18px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px;
  }
  .search > button { border: 0; border-radius: 12px; padding: 0 20px; background: var(--ink); color: var(--ground); font-weight: 600; }
  .options { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 16px; color: var(--muted); font-size: 14px; }
  .options label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .message { margin: 12px 0 0; padding: 10px 14px; border-radius: 10px; background: var(--note); color: var(--note-ink); font-size: 15px; }

  /* ---------- Layout ---------- */
  .layout { margin-top: 20px; display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 20px; align-items: start; }
  @media (max-width: 760px) { .layout { grid-template-columns: minmax(0, 1fr); } }

  /* ---------- Entry ---------- */
  .entry { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: grid; gap: 20px; }
  .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px; }
  .headword { font-family: "Literata", Georgia, serif; font-weight: 700; font-size: clamp(32px, 7vw, 46px); line-height: 1.1; margin: 0; overflow-wrap: anywhere; }
  .arrow { color: var(--muted); font-size: 24px; }
  .translation { font-family: "Literata", Georgia, serif; font-weight: 500; font-size: clamp(24px, 5vw, 32px); line-height: 1.15; overflow-wrap: anywhere; }
  .type { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; align-self: center; }

  .type.added { color: var(--en); border-color: var(--en); text-transform: none; letter-spacing: 0; }
  .search > button:disabled { opacity: 0.6; cursor: wait; }

  .meaning { background: var(--note); color: var(--note-ink); border-radius: 12px; padding: 14px 16px; }
  .label { display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; opacity: 0.85; }
  .meaning p { margin: 0; font-size: 19px; }

  .columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 560px) { .columns { grid-template-columns: minmax(0, 1fr); } }
  .col { border-radius: 12px; padding: 16px; display: grid; gap: 14px; align-content: start; }
  .col.en { background: var(--en-soft); --accent: var(--en); }
  .col.fr { background: var(--fr-soft); --accent: var(--fr); }
  .col h3 { margin: 0; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
  .col .label { color: var(--accent); opacity: 1; }
  .word-line { display: flex; align-items: center; gap: 10px; }
  .word-line strong { font-family: "Literata", Georgia, serif; font-size: 24px; line-height: 1.2; overflow-wrap: anywhere; }
  .sound { font-size: 15px; color: var(--muted); margin-top: 2px; }
  .sound .ipa { color: var(--ink); font-size: 17px; }
  .say { font-weight: 600; letter-spacing: 0.02em; }
  .example { margin: 0; font-style: italic; }
  .row { display: flex; align-items: flex-start; gap: 8px; }
  .row > :first-child { flex: 1; min-width: 0; }

  .speak {
    flex: none; width: 34px; height: 34px; border-radius: 50%; border: 0;
    background: var(--surface); color: var(--accent, var(--en)); display: grid; place-items: center;
    box-shadow: 0 1px 2px rgba(0,0,0,0.12);
  }
  .speak:hover { transform: scale(1.06); }
  .speak svg { width: 18px; height: 18px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid transparent; background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 15px; }
  .chip.linked { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .chip:hover { border-color: var(--accent); }
  .hint { margin: 0; font-size: 13px; color: var(--muted); }

  /* ---------- Word list ---------- */
  .list { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .list h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .list ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; max-height: 560px; overflow-y: auto; overflow-x: hidden; }
  .list li button { width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 6px 10px; display: flex; justify-content: space-between; gap: 8px; }
  .list li { min-width: 0; }
  .list li button:hover { background: var(--ground); }
  .list li button.active { background: var(--ink); color: var(--ground); }
  .list li button span, .list small { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list small { color: var(--muted); text-align: right; flex-shrink: 1; }
  .list li button.active small { color: inherit; opacity: 0.75; }
  .list .empty { color: var(--muted); font-size: 14px; padding: 6px 10px; }

  @media (prefers-reduced-motion: reduce) { .speak:hover { transform: none; } }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1 class="brand">Mot <span>à</span> <em>Mot</em></h1>
      <p class="tagline">English ⇄ French dictionary · sound · examples · simpler words</p>
    </div>
    <div class="direction" aria-label="Translation direction">
      <span class="lang-tag" id="fromTag">English</span>
      <button class="swap" id="swapBtn" type="button" aria-label="Swap languages" title="Swap languages">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h13l-4-4M17 17H4l4 4"/></svg>
      </button>
      <span class="lang-tag" id="toTag">French</span>
    </div>
  </header>

  <form class="search" id="searchForm">
    <div class="field">
      <input id="searchInput" type="search" autocomplete="off" spellcheck="false" placeholder="Type any word…" aria-label="Search a word" aria-controls="suggestions">
      <ul id="suggestions" class="suggestions" hidden></ul>
    </div>
    <button type="submit">Search</button>
  </form>
  <div class="options">
    <label><input type="checkbox" id="slowBox"> Speak slowly</label>
  </div>
  <p class="message" id="message" hidden></p>

  <div class="layout">
    <main id="entry" class="entry" aria-live="polite"></main>
    <aside class="list">
      <h2 id="listTitle">All words</h2>
      <ul id="wordList"></ul>
    </aside>
  </div>
</div>

/* =========================================================
   2. SMALL HELPERS
   ========================================================= */
const $ = (id) => document.getElementById(id);

// "Épuisé" -> "epuise" so people can search without accents
function clean(text) {
  return text.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
}

function esc(text) {
  return String(text).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// Remember the language direction (optional, may be blocked)
function load(key, fallback) {
  try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { /* ignore */ }
}

/* =========================================================
   3. SPEAKING (uses the voice built into the browser)
   ========================================================= */
function speak(text, lang) {
  if (!("speechSynthesis" in window)) {
    showMessage("Sorry, this browser cannot play sound. Try Chrome, Edge or Safari.");
    return;
  }
  speechSynthesis.cancel();
  const say = new SpeechSynthesisUtterance(text);
  say.lang = lang === "fr" ? "fr-FR" : "en-US";
  const voice = speechSynthesis.getVoices().find((v) => v.lang.toLowerCase().startsWith(lang));
  if (voice) say.voice = voice;
  say.rate = $("slowBox").checked ? 0.6 : 0.9;
  speechSynthesis.speak(say);
}

const SPEAKER_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';

function speakButton(text, lang, label) {
  return `<button type="button" class="speak" data-say="${esc(text)}" data-lang="${lang}" aria-label="Listen: ${esc(label || text)}" title="Listen">${SPEAKER_ICON}</button>`;
}

/* =========================================================
   4. APP STATE
   from = the language you type in ("en" or "fr")
   ========================================================= */
let from = load("motamot-from", "en") === "fr" ? "fr" : "en";
let current = WORDS[0];

const NAMES = { en: "English", fr: "French" };
const other = (lang) => (lang === "en" ? "fr" : "en");

function findExact(word, lang) {
  return WORDS.find((w) => clean(w[lang]) === clean(word));
}

/* =========================================================
   5. DRAW THE PAGE
   ========================================================= */
function showMessage(text) {
  $("message").textContent = text;
  $("message").hidden = !text;
}

function drawDirection() {
  $("fromTag").textContent = NAMES[from];
  $("fromTag").className = "lang-tag " + from;
  $("toTag").textContent = NAMES[other(from)];
  $("toTag").className = "lang-tag " + other(from);
  $("searchInput").placeholder = from === "en" ? "Type an English word… (e.g. tiny)" : "Tapez un mot français… (ex. épuisé)";
  $("listTitle").textContent = NAMES[from] + " words";
}

function languageBox(w, lang) {

    <p class="hint">Tap a speaker to listen. Similar words with a coloured border are in the dictionary — tap to open them. Other words play their sound.</p>`;
  drawList($("searchInput").value);

function drawList(query) {
  const q = clean(query || "");
  const close = suggestionsFor(q).map((s) => s.w); // also show close spellings
  const words = WORDS
    .filter((w) => !q || clean(w[from]).includes(q) || clean(w[other(from)]).includes(q) || close.includes(w))
    .sort((a, b) => a[from].localeCompare(b[from], from));

  if (!words.length) {
    $("wordList").innerHTML = '<li class="empty">No words match.</li>';
    return;
  }
  $("wordList").innerHTML = words.map((w) => `
    <li><button type="button" class="${w === current ? "active" : ""}" data-index="${WORDS.indexOf(w)}">
      <span>${esc(w[from])}</span><small>${esc(w[other(from)])}</small>
    </button></li>`).join("");
}

/* =========================================================
   6. SEARCH
   ========================================================= */
async function search(text) {
  const q = clean(text);
  if (!q) return;
  showMessage("");

  // 1) Exact word in the language you are typing
  let found = findExact(q, from);

  // 2) Exact word in the other language -> switch direction for you
  if (!found && findExact(q, other(from))) {
    found = findExact(q, other(from));
    setDirection(other(from));
    showMessage(`"${text}" is a ${NAMES[from]} word, so I switched to ${NAMES[from]} → ${NAMES[other(from)]}.`);
  }
  if (found) { drawEntry(found); return; }

  // 3) Spelled a bit wrong? ("enormus" -> "enormous")
  const close = closestWord(q);
  if (close) {
    if (close.lang !== from) setDirection(close.lang);
    showMessage(`Did you mean "${close.w[close.lang]}"? Here it is.`);
    drawEntry(close.w);
    return;
  }

  // 4) Not in the list: ask Claude to write the entry (only works in the published app)
  if (askClaude && await lookUpWithClaude(text.trim())) return;

  // 5) No Claude: try the start of a word, or a simpler/similar word ("big" finds "enormous")
  found = WORDS.find((w) => clean(w[from]).startsWith(q));
  if (!found) {
    const key = from === "en" ? ["simpleEn", "synEn"] : ["simpleFr", "synFr"];
    found = WORDS.find((w) => clean(w[key[0]]).includes(q) || w[key[1]].some((s) => clean(s) === q));
    if (found) showMessage(`"${text}" is not a main word here, but it is close to "${found[from]}".`);
  }

  if (found) {
    drawEntry(found);
  } else if (!$("message").textContent) {
    showMessage(`"${text}" is not in the dictionary yet. Pick a word from the list, or add it to WORDS in the code.`);
  }
}

/* =========================================================
   6a. SPELLING HELP
   "How many letters must change to turn one word into the other?"
   enormus -> enormous = 1 change, so it is a close spelling.
   ========================================================= */
function changesBetween(a, b) {
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const row = [i];
    for (let j = 1; j <= b.length; j++) {
      row[j] = Math.min(prev[j] + 1, row[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = row;
  }
  return prev[b.length];
}

// How many mistakes we allow: none for short words, more for long words
const allowed = (q) => (q.length < 4 ? 0 : q.length < 8 ? 1 : 2);

// Best close spelling for a whole word, in either language
function closestWord(q) {
  let best = null;
  WORDS.forEach((w) => ["en", "fr"].forEach((lang) => {
    const d = changesBetween(q, clean(w[lang]));
    const score = d + (lang === from ? 0 : 0.5); // prefer the language you type in
    if (d <= allowed(q) && (!best || score < best.score)) best = { w, lang, score };
  }));
  return best;
}

// Words to suggest while typing (start of the word, or nearly)
function suggestionsFor(text) {
  const q = clean(text);
  if (!q) return [];
  const found = [];
  WORDS.forEach((w) => ["en", "fr"].forEach((lang) => {
    const word = clean(w[lang]);
    let score = null;
    if (word.startsWith(q)) score = 0;                                              // typed the start
    else if (q.length >= 3 && changesBetween(q, word.slice(0, q.length)) <= 1) score = 1; // small typo
    else if (changesBetween(q, word) <= allowed(q)) score = 1;                      // whole word, small typo
    if (score !== null) found.push({ w, lang, score: score + (lang === from ? 0 : 0.5) });
  }));
  return found.sort((a, b) => a.score - b.score || a.w[a.lang].localeCompare(b.w[b.lang])).slice(0, 6);
}

let shown = [];     // suggestions on screen
let picked = -1;    // which one the arrow keys point at

function drawSuggestions(text) {
  shown = suggestionsFor(text);
  picked = -1;
  $("suggestions").innerHTML = shown.map((s, i) => `
    <li><button type="button" data-pick="${i}">
      <span class="flag ${s.lang}">${s.lang.toUpperCase()}</span>
      <span>${esc(s.w[s.lang])}</span>
      <small>${esc(s.w[other(s.lang)])}</small>
    </button></li>`).join("");
  $("suggestions").hidden = shown.length === 0;
}

function hideSuggestions() { $("suggestions").hidden = true; picked = -1; }

function openSuggestion(i) {
  const s = shown[i];
  if (!s) return;
  if (s.lang !== from) setDirection(s.lang);
  $("searchInput").value = s.w[s.lang];
  hideSuggestions();
  showMessage("");
  drawEntry(s.w);
}

/* =========================================================
   6b. LOOK UP NEW WORDS WITH CLAUDE
   Works when the app is opened on claude.ai. New words are
   saved on this device so they are there next time.
   ========================================================= */
let askClaude = null;
if (window.claude && window.claude.use) {
  window.claude.use("sample").then((fn) => { askClaude = fn; }).catch(() => {});
}

function makePrompt(word) {
  return `You are a friendly English–French dictionary for language learners.
The learner typed: "${word}" (they are searching in ${NAMES[from]}, but the word may be ${NAMES[other(from)]}).

Reply with ONLY one JSON object, no other text, in exactly this shape:
{"found": true,
 "lang": "en" or "fr" (the language of the typed word),
 "en": "the English word", "fr": "the French translation",
 "type": "noun" | "verb" | "adjective" | "adverb" | "phrase" | ...,
 "enIpa": "/IPA/", "enSay": "easy sound-it-out spelling with the stressed part in CAPITALS, like ih-NOR-mus",
 "frIpa": "/IPA/", "frSay": "sound-it-out spelling for English speakers, like ay-NORM",
 "simpleEn": "a simpler everyday English word or short phrase",
 "simpleFr": "a simpler everyday French word or short phrase",
 "meaning": "one or two short sentences in very simple English (easy for a beginner)",
 "synEn": ["three", "similar", "English words"], "synFr": ["three", "similar", "French words"],
 "exEn": "a short, natural English example sentence using the word",
 "exFr": "the French translation of that example, using the French word"}

Use lowercase for the words unless they are names. Fix small spelling mistakes in what the learner typed.
If it is not a real English or French word, reply {"found": false, "suggestion": "the closest real word, or empty"}.`;
}

// Check Claude's answer has everything the page needs
function toEntry(data) {
  const str = (v) => (typeof v === "string" ? v.trim() : "");
  const list = (v) => (Array.isArray(v) ? v.map(str).filter(Boolean).slice(0, 5) : []);
  const w = {
    en: str(data.en), fr: str(data.fr), type: str(data.type) || "word",
    enIpa: str(data.enIpa), enSay: str(data.enSay), frIpa: str(data.frIpa), frSay: str(data.frSay),
    simpleEn: str(data.simpleEn), simpleFr: str(data.simpleFr), meaning: str(data.meaning),
    synEn: list(data.synEn), synFr: list(data.synFr), exEn: str(data.exEn), exFr: str(data.exFr),
    added: true,
  };
  return w.en && w.fr && w.meaning ? w : null;
}

// Returns true when it showed something (an entry or a clear message)
async function lookUpWithClaude(word) {
  const btn = $("searchForm").querySelector("button");
  btn.disabled = true;
  showMessage(`"${word}" is not in the list yet — asking Claude to look it up… (this can take a few seconds)`);
  try {
    const data = await askClaude.json(makePrompt(word), { cache: { gcTime: 86400000 } });
    if (!data || data.found === false) {
      const tip = data && data.suggestion ? ` Did you mean "${data.suggestion}"?` : "";
      showMessage(`I couldn't find "${word}" as an English or French word.${tip}`);
      return true;
    }
    const entry = toEntry(data);
    if (!entry) { showMessage(`Claude's answer for "${word}" was incomplete. Please try again.`); return true; }

    // Already in the list under its correct spelling? Just open that one.
    const lang = data.lang === "fr" ? "fr" : "en";
    const existing = findExact(entry[lang], lang) || findExact(entry.en, "en");
    const w = existing || entry;
    if (!existing) { WORDS.push(entry); saveAdded(); }
    if (lang !== from) setDirection(lang);
    const fixed = clean(entry[lang]) !== clean(word) ? `Did you mean "${entry[lang]}"? ` : "";
    showMessage(fixed + (existing ? "Here it is." : `New word added: "${entry[lang]}". It is saved on this device.`));
    drawEntry(w);
    return true;
  } catch (e) {
    const code = e && e.code;
    if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(code)) {
      askClaude = null; // looking up new words is turned off here; use the built-in list
      return false;
    }
    if (code === "rate_limited") showMessage("Too many look-ups right now. Please wait a minute and try again.");
    else if (code === "session_expired") showMessage("Please sign in to Claude again, then search again.");
    else showMessage(`The look-up for "${word}" didn't work. Please try again.`);
    return true;
  } finally {
    btn.disabled = false;
  }
}

// Keep words Claude added on this device
function saveAdded() {
  save("motamot-added", JSON.stringify(WORDS.filter((w) => w.added)));
}
try {
  const saved = JSON.parse(load("motamot-added", "[]"));
  saved.forEach((d) => {
    const w = toEntry(d);
    if (w && !findExact(w.en, "en")) WORDS.push(w);
  });
} catch (e) { /* ignore broken saved data */ }

function setDirection(lang) {
  from = lang;
  save("motamot-from", from);
  drawDirection();
}

/* =========================================================
   7. BUTTON CLICKS
   ========================================================= */
$("searchForm").addEventListener("submit", (e) => {
  e.preventDefault();
  hideSuggestions();
  search($("searchInput").value);
});

$("searchInput").addEventListener("input", (e) => {
  drawList(e.target.value);
  drawSuggestions(e.target.value);
});

// Arrow keys move through suggestions, Enter opens one, Escape closes them
$("searchInput").addEventListener("keydown", (e) => {
  if ($("suggestions").hidden) return;
  const buttons = $("suggestions").querySelectorAll("button");
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    picked = (picked + (e.key === "ArrowDown" ? 1 : -1) + buttons.length) % buttons.length;
    buttons.forEach((b, i) => b.classList.toggle("on", i === picked));
  } else if (e.key === "Enter" && picked >= 0) {
    e.preventDefault();
    openSuggestion(picked);
  } else if (e.key === "Escape") {
    hideSuggestions();
  }
});

$("swapBtn").addEventListener("click", () => {
  setDirection(other(from));
  showMessage("");
  drawEntry(current);
});

// One listener for all buttons inside the page
document.addEventListener("click", (e) => {
  const pick = e.target.closest("[data-pick]");
  if (pick) { openSuggestion(Number(pick.dataset.pick)); return; }
  if (!e.target.closest(".field")) hideSuggestions();

  const speakBtn = e.target.closest(".speak");
  if (speakBtn) { speak(speakBtn.dataset.say, speakBtn.dataset.lang); return; }

  const chip = e.target.closest(".chip");
  if (chip) {
    const w = findExact(chip.dataset.word, chip.dataset.lang);
    if (w) {
      if (chip.dataset.lang !== from) setDirection(chip.dataset.lang);
      showMessage("");
      drawEntry(w);
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else {
      speak(chip.dataset.word, chip.dataset.lang);
    }
    return;
  }

  const item = e.target.closest("#wordList button");
  if (item) { showMessage(""); drawEntry(WORDS[Number(item.dataset.index)]); }
});

// Some browsers load voices a little later
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => {};

/* =========================================================
   8. START
   ========================================================= */
drawDirection();
drawEntry(from === "en" ? WORDS[0] : findExact("épuisé", "fr"));
</script>
